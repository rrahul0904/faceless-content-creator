name: Creative Production Preview (REA)
on:
  push:
    branches: [research/rea-supercmo-creative-production-20261021]
    paths:
      - 'lib/creative-production/**'
      - 'scripts/test-creative-production.mjs'
      - 'scripts/smoke-creative-preview-http.mjs'
      - '.github/workflows/creative-production-preview.yml'
  pull_request:
    paths:
      - 'lib/creative-production/**'
      - 'scripts/test-creative-production.mjs'
      - 'app/api/v1/creative-production/**'
      - '.github/workflows/creative-production-preview.yml'
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic production preview and adversarial tests
        run: node --experimental-strip-types --test scripts/test-creative-production.mjs
  static-check:
    needs: offline-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck app including new route and UI
        run: npm run typecheck
      - name: Lint changed production source
        run: npx eslint lib/creative-production/preview.ts app/api/v1/creative-production/preview/route.ts app/creative-production/page.tsx app/page.tsx
      - name: Initialize isolated local database
        run: mkdir -p data/renders data/work && npm run db:push
      - name: Compile production Next.js application
        run: npm run build
      - name: Exercise creative API with a real local HTTP server
        shell: bash
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js >/tmp/creative-preview-next.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/creative-preview-next.log; exit 1; fi
          node scripts/smoke-creative-preview-http.mjs
