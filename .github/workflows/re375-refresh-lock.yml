name: RE-375 Refresh Patched Lock

on:
  push:
    branches:
      - reverse/re-375-trupeer-workflow-compiler
    paths:
      - .github/workflows/re375-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/re-375-trupeer-workflow-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lock with current patched Next dependencies
        run: |
          npm install --package-lock-only --save-exact next@16.4.0 eslint-config-next@16.4.0
          npm audit --omit=dev --audit-level=high
      - name: Commit patched lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch production dependency advisories"
          git push origin HEAD:reverse/re-375-trupeer-workflow-compiler
