name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: npm install
      - name: Capture generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          retention-days: 1
      - name: Commit generated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/reproducible-builds'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json unchanged"
          else
            git commit -m "build: commit generated npm lockfile"
            git push
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: mkdir -p data/renders data/work && npm run db:push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Render real MP4 through worker
        run: npm run render:smoke
      - name: Build zero-config Docker image
        run: docker build -t faceless-content-creator:ci .
      - name: Boot zero-config Docker image
        run: docker run -d --name faceless-ci -p 3000:3000 faceless-content-creator:ci
      - name: Exercise app APIs and fetch rendered MP4
        run: npm run http:smoke
      - name: Show container logs on failure
        if: failure()
        run: docker logs faceless-ci || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f faceless-ci || true
