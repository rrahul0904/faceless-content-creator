name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: npm ci
      - name: Verify deployed Creator Console modules
        run: |
          node --check creator-console/visual-story.js
          node --check creator-console/visual-story-persistence.js
          node --check creator-console/api/visual-story.js
          node --check creator-console/api/visual-story-render.js
          node --check creator-console/api/visual-story-storage.js
          node --check creator-console/api/visual-story-icons.js
          node --check creator-console/lib/visual-story.js
          node --check creator-console/lib/visual-story-qa.js
          node --check creator-console/lib/technical-icons.js
          node -e "const icons=require('./creator-console/lib/technical-icons'); const s3=icons.resolveTechnicalIcon('Amazon S3'); const dbx=icons.resolveTechnicalIcon('Databricks'); if(s3?.key!=='aws:s3'||s3.assetMode!=='fallback'||dbx?.kind!=='brand-mark') process.exit(1); console.error('Technical icon registry PASS', icons.registryVersion)"
          npm --prefix creator-console test
      - name: Verify MCP visual-story adapter
        run: |
          node --check mcp/visual-story-server.mjs
          node --input-type=module -e "await import('@modelcontextprotocol/server'); await import('@modelcontextprotocol/server/stdio'); console.error('MCP SDK import PASS')"
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: mkdir -p data/renders data/work && npm run db:push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Render real MP4 through worker
        run: npm run render:smoke
      - name: Render durable VisualStorySpec GIF through worker
        run: npm run visual-story:smoke
      - name: Build zero-config Docker image
        run: docker build -t faceless-content-creator:ci .
      - name: Boot zero-config Docker image
        run: >-
          docker run -d --name faceless-ci
          -e FCC_FREE_RENDER_JOBS_PER_MONTH=2
          -e FCC_FREE_STORAGE_MB=1
          -e FCC_FREE_METERED_REQUESTS_PER_MINUTE=7
          -e FCC_FREE_MEMBERS=1
          -p 3000:3000
          faceless-content-creator:ci
      - name: Create one-time workspace API key for acceptance
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" = 40 ]; then exit 1; fi
            sleep 1
          done
          KEY_JSON="$(docker exec faceless-ci node scripts/create-api-key.mjs --workspace local --name ci-smoke --days 1)"
          SMOKE_API_KEY="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.apiKey)' "$KEY_JSON")"
          test -n "$SMOKE_API_KEY"
          echo "::add-mask::$SMOKE_API_KEY"
          echo "SMOKE_API_KEY=$SMOKE_API_KEY" >> "$GITHUB_ENV"
      - name: Exercise governed technical icon registry
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run visual-story:icons-smoke
      - name: Exercise visual-story persistence and immutable versions
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run visual-story:persistence-smoke
      - name: Exercise conversational visual-story refinement
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run visual-story:refine-smoke
      - name: Exercise deterministic visual-story carousel compilation
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run visual-story:carousel-smoke
      - name: Exercise app APIs and fetch rendered MP4
        run: npm run http:smoke
      - name: Reset CI rate bucket for deterministic limit acceptance
        run: docker exec faceless-ci node scripts/reset-rate-limit.mjs --workspace local
      - name: Exercise plan limits and membership controls
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run limits:smoke
      - name: Boot hosted API-key mode
        run: docker run -d --name faceless-auth-ci -e FCC_AUTH_MODE=api-key -p 3001:3000 faceless-content-creator:ci
      - name: Create hosted-mode operator API key
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            if [ "$attempt" = 40 ]; then exit 1; fi
            sleep 1
          done
          AUTH_KEY_JSON="$(docker exec faceless-auth-ci node scripts/create-api-key.mjs --workspace local --name hosted-ci-smoke --days 1)"
          HOSTED_SMOKE_API_KEY="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.apiKey)' "$AUTH_KEY_JSON")"
          test -n "$HOSTED_SMOKE_API_KEY"
          echo "::add-mask::$HOSTED_SMOKE_API_KEY"
          echo "HOSTED_SMOKE_API_KEY=$HOSTED_SMOKE_API_KEY" >> "$GITHUB_ENV"
      - name: Exercise fail-closed hosted authentication
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
          SMOKE_API_KEY: ${{ env.HOSTED_SMOKE_API_KEY }}
        run: npm run auth:smoke
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs faceless-ci || true
          docker logs faceless-auth-ci || true
      - name: Stop smoke containers
        if: always()
        run: |
          docker rm -f faceless-ci || true
          docker rm -f faceless-auth-ci || true
