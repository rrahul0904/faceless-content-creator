name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Creator Console contracts
        run: cd creator-console && npm test
      - name: Verify Creator Data Service
        run: cd creator-data-service && npm test
      - name: Exercise Creator Data Service persistent volume restart
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="creator-data-ci-token"
          VOLUME="creator-data-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f creator-data-ci >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build -t creator-data-service:ci creator-data-service
          docker volume create "$VOLUME" >/dev/null
          docker run -d --name creator-data-ci \
            -e CREATOR_DATA_TOKEN="$TOKEN" \
            -v "$VOLUME:/data" \
            -p 8787:8787 \
            creator-data-service:ci >/dev/null

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs creator-data-ci; exit 1; fi
            sleep 1
          done

          cat > /tmp/creator-brief.json <<'JSON'
          {
            "brief": {
              "id": "ci-volume-brief",
              "topic": "Source-traceable technical repurposing",
              "status": "evidence-ready",
              "mode": "analysis",
              "teachingOutcome": "Preserve evidence while adapting a long-form source",
              "creatorTake": "Traceability should survive every transformation.",
              "platforms": ["linkedin", "medium"]
            },
            "sources": [
              {
                "id": "source-video-1",
                "url": "https://example.com/reference-video",
                "canonicalUrl": "https://example.com/reference-video",
                "evidenceClass": "first-party-public",
                "title": "Reference source",
                "publisher": "Example",
                "resolutionStatus": "resolved",
                "sourceLocator": {
                  "kind": "transcript",
                  "startSeconds": 42,
                  "endSeconds": 55,
                  "passage": "qualified source passage"
                }
              }
            ],
            "claims": [
              {
                "id": "claim-1",
                "text": "The claim remains tied to its original source segment.",
                "claimType": "fact",
                "status": "supported",
                "confidence": "high",
                "supportingSourceIds": ["source-video-1"]
              }
            ]
          }
          JSON

          curl -fsS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/creator-brief.json \
            http://127.0.0.1:8787/v1/briefs/ci-volume-brief >/tmp/creator-before.json

          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("/tmp/creator-before.json","utf8"));
            if(x?.data?.brief?.id!=="ci-volume-brief") throw new Error("brief save failed");
            if(x?.data?.sources?.[0]?.sourceLocator?.startSeconds!==42) throw new Error("source locator missing before restart");
          '

          docker rm -f creator-data-ci >/dev/null
          docker run -d --name creator-data-ci \
            -e CREATOR_DATA_TOKEN="$TOKEN" \
            -v "$VOLUME:/data" \
            -p 8787:8787 \
            creator-data-service:ci >/dev/null

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs creator-data-ci; exit 1; fi
            sleep 1
          done

          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8787/v1/briefs/ci-volume-brief >/tmp/creator-after.json

          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("/tmp/creator-after.json","utf8"));
            const source=x?.data?.sources?.[0];
            const claim=x?.data?.claims?.[0];
            if(x?.data?.brief?.id!=="ci-volume-brief") throw new Error("brief did not survive container replacement");
            if(source?.id!=="source-video-1") throw new Error("source identity changed after restart");
            if(source?.sourceLocator?.startSeconds!==42 || source?.sourceLocator?.endSeconds!==55) throw new Error("timestamp provenance did not survive restart");
            if(claim?.id!=="claim-1" || claim?.supportingSourceIds?.[0]!=="source-video-1") throw new Error("claim/source linkage did not survive restart");
          '
      - name: Install local media engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: mkdir -p data/renders data/work && npm run db:push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Render real MP4 through worker
        run: npm run render:smoke
      - name: Build zero-config Docker image
        run: docker build -t faceless-content-creator:ci .
      - name: Boot zero-config Docker image
        run: >-
          docker run -d --name faceless-ci
          -e FCC_FREE_RENDER_JOBS_PER_MONTH=2
          -e FCC_FREE_STORAGE_MB=1
          -e FCC_FREE_METERED_REQUESTS_PER_MINUTE=7
          -e FCC_FREE_MEMBERS=1
          -p 3000:3000
          faceless-content-creator:ci
      - name: Create one-time workspace API key for acceptance
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" = 40 ]; then exit 1; fi
            sleep 1
          done
          KEY_JSON="$(docker exec faceless-ci node scripts/create-api-key.mjs --workspace local --name ci-smoke --days 1)"
          SMOKE_API_KEY="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.apiKey)' "$KEY_JSON")"
          test -n "$SMOKE_API_KEY"
          echo "::add-mask::$SMOKE_API_KEY"
          echo "SMOKE_API_KEY=$SMOKE_API_KEY" >> "$GITHUB_ENV"
      - name: Exercise app APIs and fetch rendered MP4
        run: npm run http:smoke
      - name: Exercise plan limits and membership controls
        env:
          SMOKE_API_KEY: ${{ env.SMOKE_API_KEY }}
        run: npm run limits:smoke
      - name: Boot hosted API-key mode
        run: docker run -d --name faceless-auth-ci -e FCC_AUTH_MODE=api-key -p 3001:3000 faceless-content-creator:ci
      - name: Create hosted-mode operator API key
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            if [ "$attempt" = 40 ]; then exit 1; fi
            sleep 1
          done
          AUTH_KEY_JSON="$(docker exec faceless-auth-ci node scripts/create-api-key.mjs --workspace local --name hosted-ci-smoke --days 1)"
          HOSTED_SMOKE_API_KEY="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.apiKey)' "$AUTH_KEY_JSON")"
          test -n "$HOSTED_SMOKE_API_KEY"
          echo "::add-mask::$HOSTED_SMOKE_API_KEY"
          echo "HOSTED_SMOKE_API_KEY=$HOSTED_SMOKE_API_KEY" >> "$GITHUB_ENV"
      - name: Exercise fail-closed hosted authentication
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
          SMOKE_API_KEY: ${{ env.HOSTED_SMOKE_API_KEY }}
        run: npm run auth:smoke
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs faceless-ci || true
          docker logs faceless-auth-ci || true
      - name: Stop smoke containers
        if: always()
        run: |
          docker rm -f faceless-ci || true
          docker rm -f faceless-auth-ci || true
