name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local media engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: mkdir -p data/renders data/work && npm run db:push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Render real MP4 smoke test
        run: npm run render:smoke
