<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Console</title><style>*{box-sizing:border-box}body{margin:0;background:#080b11;color:#edf2fb;font:14px system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0}.sub{color:#8998ad;font-size:12px}.grid{display:grid;grid-template-columns:350px 1fr 390px;gap:14px}.card{background:#111720;border:1px solid #263041;border-radius:14px;overflow:hidden}.hd{padding:13px 14px;border-bottom:1px solid #263041;font-weight:700}.bd{padding:14px}.field{margin-bottom:11px}label{display:block;color:#adbacd;font-size:12px;margin-bottom:5px}input,textarea,select{width:100%;background:#0a1018;color:#edf2fb;border:1px solid #2c394d;border-radius:9px;padding:9px}textarea{min-height:80px;resize:vertical}button{border:1px solid #4e73b8;background:#18325d;color:white;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.draft{white-space:pre-wrap;min-height:510px;border:1px solid #263041;border-radius:10px;padding:15px;background:#090e15}.source{border:1px solid #263041;border-radius:9px;padding:9px;margin-bottom:8px;background:#0c121b}.source b{display:block;font-size:12px}.meta{font-size:11px;color:#8390a3}.score{float:right;color:#7ea8f8}.pill{font-size:11px;border:1px solid #2b5b48;color:#78d7a4;border-radius:99px;padding:4px 8px}.warn{color:#efc66a}.muted{color:#718096}@media(max-width:1050px){.grid{grid-template-columns:1fr}.draft{min-height:300px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Creator Console</h1><div class="sub">Owned context-fed writing agent · LinkedIn + Medium</div></div><div class="pill" id="health">checking…</div></div><div class="grid"><section class="card"><div class="hd">Author context</div><div class="bd"><div class="field"><label>Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Role / positioning</label><input id="role" placeholder="e.g. Data Architect · Applied AI"></div><div class="field"><label>Bio / evidence about you</label><textarea id="bio" placeholder="What the agent is actually allowed to say about you"></textarea></div><div class="field"><label>Audience</label><input id="audience" placeholder="Data engineers, architects, CTOs…"></div><div class="field"><label>Voice</label><textarea id="tone" placeholder="Technical, opinionated but fair, evidence-led, concise…"></textarea></div><div class="field"><label>Expertise / source notes</label><textarea id="knowledge" placeholder="Paste facts, notes, source URLs, project-safe evidence…"></textarea></div></div></section><section class="card"><div class="hd">Compose</div><div class="bd"><div class="row"><div class="field"><label>Platform</label><select id="platform"><option value="linkedin">LinkedIn</option><option value="medium">Medium</option></select></div><div class="field"><label>Reference depth</label><select id="topK"><option>8</option><option selected>12</option><option>18</option></select></div></div><div class="field"><label>Topic</label><textarea id="topic" placeholder="e.g. What Snowflake AI SQL caching changes for production inference workloads"></textarea></div><div class="field"><label>Objective / angle</label><textarea id="objective" placeholder="Explain what changed, why architects should care, tradeoffs, and practical guidance"></textarea></div><button id="go">Build context + draft</button><p class="sub">Reference creators influence structure only. Their claims, tests and wording are not treated as yours.</p><div id="draft" class="draft muted">Your generated draft will appear here.</div></div></section><aside class="card"><div class="hd">Context packet</div><div class="bd"><div id="stats" class="sub">No retrieval run yet.</div><div id="sources" style="margin-top:10px"></div></div></aside></div></div><script>const $=id=>document.getElementById(id);async function health(){try{const r=await fetch('/api/health'),j=await r.json();$('health').textContent=j.ok?`live · ${j.referenceCorpus} references${j.modelConfigured?' · model on':' · model off'}`:'unhealthy';}catch{$('health').textContent='health unavailable'}}health();$('go').onclick=async()=>{const topic=$('topic').value.trim();if(!topic)return;const notes=$('knowledge').value.trim();const context={identity:{name:$('name').value,role:$('role').value,bio:$('bio').value,audience:$('audience').value},voice:{tone:$('tone').value},knowledge:notes?[{id:'session-notes',title:'Session source notes',content:notes,tags:topic.split(/\s+/).slice(0,12)}]:[]};$('go').disabled=true;$('draft').textContent='Retrieving context…';$('sources').innerHTML='';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,platform:$('platform').value,objective:$('objective').value,topK:Number($('topK').value),context})}),j=await r.json();if(!r.ok)throw new Error(j.message||j.error);$('draft').classList.remove('muted');$('draft').textContent=j.draft;$('stats').textContent=`${j.packet.retrieval.selectedCount} selected from ${j.packet.retrieval.candidateCount} candidates · ${j.mode}`;for(const s of j.packet.selected){const d=document.createElement('div');d.className='source';d.innerHTML=`<span class="score">${s.score}</span><b>${s.title}</b><div class="meta">${s.type} · trust=${s.trust}</div>`;$('sources').appendChild(d)}}catch(e){$('draft').textContent='Error: '+e.message}finally{$('go').disabled=false}};</script></body></html>
