services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: faceless
      POSTGRES_USER: faceless
      POSTGRES_PASSWORD: faceless
    ports: ["5432:5432"]
    volumes:
      - faceless_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://faceless:faceless@postgres:5432/faceless
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes:
  faceless_pg:
